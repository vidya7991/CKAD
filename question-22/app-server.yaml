apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    tier: frontend
  name: app-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-server
  strategy: {}
  template:
    metadata:
      labels:
        app: app-server
    spec:
      containers:
      - image: nginx:1.17
        name: nginx
        ports:
        - containerPort : 8080
        resources: {}
        volumeMounts:
        - name: app-config-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: app-config-volume
        configMap:
          name: html-config
status: {}