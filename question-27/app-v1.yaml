apiVersion: apps/v1
kind: Deployment
metadata:
 name: app-v1
 labels:
   app: nginx
spec:
 replicas: 5
 selector:
   matchLabels:
     app: nginx
 template:
   metadata:
     labels:
       app: nginx
   spec:
     containers:
     - name: nginx
       image: nginx:1.19
       ports:
       - containerPort: 80
 strategy:
   type: RollingUpdate
   rollingUpdate:
     maxUnavailable: 1
     maxSurge: 2